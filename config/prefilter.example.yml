# prefilter.example.yml — deterministic pre-scoring rules for prefilter.mjs
#
# Copy to workspace/search/prefilter.yml and edit for YOUR search. That file is
# gitignored (user layer); this example is tracked so the defaults ship.
#
#     cp config/prefilter.example.yml workspace/search/prefilter.yml
#
# WHAT THIS DOES
# --------------
# Rejects roles that cannot fit, BEFORE any model is invoked. Every rejection
# is logged with the rule and the matched text to workspace/.state/prefilter-rejects.tsv,
# so nothing is dropped silently and you can tune from evidence.
#
# DESIGN RULE: bias toward keeping. An unclear role passes through to the LLM.
# A false reject costs an opportunity; a false keep costs a few cents.
#
# All patterns are case-insensitive RE2-compatible regex fragments. They run
# through a linear-time engine, so lookarounds and backreferences are rejected.

# ---------------------------------------------------------------------------
# keep_signals — tokens implying the role owns an org, a programme, or a P&L.
# These RESCUE a role that would otherwise be rejected as IC or junior, which
# is how "Engineering Manager" survives while "Staff Engineer" does not.
#
# Targeting an IC track instead? Empty this list and empty ic_families below.
# ---------------------------------------------------------------------------
keep_signals:
  - '\bhead of\b'
  - '\bdirector\b'
  - '\bvp\b'
  - '\bvice president\b'
  - '\bchief\b'
  - '\bmanaging director\b'
  - '\bgeneral manager\b'
  - '\bpartner\b'
  - '\bpractice (lead|director|manager)\b'
  - '\bdelivery (lead|manager|director)\b'
  - '\b(programme?|program) (manager|director|lead)\b'
  - '\bengineering manager\b'
  - '\bhead\b'
  - '\blead of\b'
  - '\bchief of staff\b'

# ---------------------------------------------------------------------------
# ic_families — individual-contributor ROLE FAMILIES. Rejected unless a
# keep_signal also matches, which is how "Engineering Manager" survives while
# "Staff Engineer" does not.
#
# NOTE: family, not seniority. A Staff Engineer is senior AND an IC.
#
# SHIPS EMPTY ON PURPOSE. Whether IC roles are wrong depends entirely on who
# you are: rejecting "engineer" is right for a delivery director and absurd
# for an engineer. Uncomment the preset below only if you are targeting
# management/leadership and want IC roles filtered out.
#
# With this empty, prefilter still rejects on enabled hard_blockers and comp —
# it just does not judge IC vs leadership.
# ---------------------------------------------------------------------------
ic_families: []

# --- Preset: filtering OUT individual-contributor roles -------------------
# Use when you are targeting management / leadership.
#
#   - '\b(software|backend|frontend|full[- ]?stack|platform|infrastructure|inference|security|data|ml|machine learning|research|product|systems|solutions?|forward deployed|applied)\s+engineer\b'
#   - '\b(engineer|developer|programmer)\b'
#   - '\b(research|data|machine learning|applied)\s+scientist\b'
#   - '\bscientist\b'
#   - '\bdesigner\b'
#   - '\banalyst\b'
#   - '\bconsultant\b'
#   - '\btechnician\b'
#   - '\barchitect\b'
#   - '\bmember of technical staff\b'
#
# --- Preset: filtering OUT management roles -------------------------------
# Use when you are an IC and want to avoid people-management. Put these in
# wrong_functions instead (they are checked first and cannot be rescued):
#
#   - '\b(engineering|delivery) manager\b'
#   - '\bhead of\b'
#   - '\bdirector\b'

# ---------------------------------------------------------------------------
# wrong_functions — job functions outside YOUR field. Checked FIRST, so a
# matching role is rejected even if it carries a keep_signal ("Head of
# Marketing" dies here).
#
# SHIPS EMPTY ON PURPOSE. What counts as "wrong" is entirely personal: the
# sales lines below are correct for an engineer and catastrophic for a sales
# director. Uncomment only the groups that are wrong for YOU.
#
# Check workspace/.state/prefilter-rejects.tsv after your first run — if something you
# wanted got rejected, the rule that did it is named in the log.
# ---------------------------------------------------------------------------
wrong_functions: []

# --- Presets: copy the lines you want into wrong_functions above ---------
#
# Commercial / go-to-market:
#   - '\b(sales|account executive|business development|bdr|sdr)\b'
#   - '\bmarketing\b'
#   - '\bbrand\b'
#   - '\bcommunications?\b'
#   - '\bpublic relations\b'
#
# People / internal ops:
#   - '\brecruit(er|ing|ment)\b'
#   - '\btalent acquisition\b'
#   - '\b(people|hr) (ops|operations|business partner)\b'
#
# Finance / legal:
#   - '\b(finance|accounting|accountant|tax|audit|controller|treasury)\b'
#   - '\b(legal|counsel|paralegal|compliance officer)\b'
#
# Clinical / life sciences:
#   - '\b(clinical|medical|nurse|physician|pharmacovigilance|epidemiolog)'
#
# Physical operations:
#   - '\breal estate\b'
#   - '\blogistics\b'
#   - '\bwarehouse\b'
#   - '\bretail\b'

# ---------------------------------------------------------------------------
# below_level — seniority below YOUR target, regardless of function.
#
# SHIPS EMPTY ON PURPOSE. A junior role is a mismatch for a director and the
# intended target for an early-career candidate. Uncomment the preset only
# when those levels are outside your search. Matches are rescued by a
# keep_signal, so "Associate Director" survives "associate".
# ---------------------------------------------------------------------------
below_level: []

# --- Preset: filtering OUT early-career roles -----------------------------
# Use when you are targeting established senior/leadership roles.
#
#   - '\b(intern|internship|graduate|apprentice|trainee|placement)\b'
#   - '\bjunior\b'
#   - '\bentry[- ]level\b'
#   - '\bassociate\b'
#   - '\bfellows?(hips?)?\b'
#   - '\bresidency\b'
#   - '\bbootcamp\b'

# ---------------------------------------------------------------------------
# hard_blockers — matched against the JD BODY, not the title. Each needs
# `all` (every pattern must match) so a single loose word cannot fire it.
#
# The clearance example below requires BOTH a clearance token AND an
# "already hold it" qualifier — a JD offering to sponsor clearance is not a
# blocker. The sponsorship example requires immigration context, because
# "without sponsorship" also appears in export-control boilerplate and that
# false positive killed a real Director role during testing.
# ---------------------------------------------------------------------------
hard_blockers:
  - id: active_security_clearance
    enabled: false # enable only if you do NOT hold the clearance in question
    all:
      - '\b(sc|dv|security)\s*clearance\b'
      - '\b(active|current|existing|must (already )?(hold|have)|holds?)\b[^.]{0,60}\bclearance\b'
    reason: requires an ACTIVE security clearance

  - id: no_visa_sponsorship
    enabled: false # enable only if you NEED sponsorship in the target market
    all:
      - '\b(visa|immigration|work (permit|authoriz|authoris)|right to work)\b'
      - '\b(unable to sponsor|cannot sponsor|do(es)? not (offer|provide) sponsor|no (visa )?sponsorship (is )?(available|offered|provided))\b'
    reason: JD explicitly states no visa sponsorship

# ---------------------------------------------------------------------------
# comp — reject on published salary. The floor is read from
# workspace/profile/profile.yml -> compensation.minimum, so it lives with your other
# personal data and never appears here.
#
# clearance_margin: published figures are usually BASE; your floor is usually
# TOTAL comp. Bonus and equity routinely close a 20-30% gap, so only reject
# when the published number is below (floor * margin). Set to 1.0 to disable
# the allowance, or enabled: false to skip comp checks entirely.
# ---------------------------------------------------------------------------
comp:
  enabled: true
  clearance_margin: 0.8
