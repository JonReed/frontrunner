name: Bug Report
description: Report a reproducible Frontrunner defect
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        > **Privacy first.** Frontrunner runs locally. Never paste your CV, scan
        > results, pipeline data, private job listings, credentials, or other
        > personal information. Share only sanitized examples.
  - type: checkboxes
    id: search
    attributes:
      label: Existing issues
      options:
        - label: I searched existing issues and this hasn't been reported yet
          required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How can we reproduce this?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened?
  - type: input
    id: cli
    attributes:
      label: CLI tool
      placeholder: "e.g., Claude Code, OpenCode, Codex"
  - type: input
    id: os
    attributes:
      label: OS and Node.js version
      placeholder: "e.g., macOS 15 / Node 24.0"
  - type: textarea
    id: doctor
    attributes:
      label: Output of `npm run doctor`
      description: Remove any personal data or secrets before pasting.
      render: shell
